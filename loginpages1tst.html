<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login</title>

<style>
  body {
    margin: 0; 
    background: #454545;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    height: 100vh;
    align-items: center;
  }
  .container {
    background: #ccc;
    width: 360px;
    padding: 20px 0;
    border-radius: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo-box {
    background: white;
    width: 160px;
    height: 120px;
    margin-bottom: 25px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  
  .logo-box svg {
    max-width: 120px;
    max-height: 80px;
  }
  form {
    background: white;
    width: 280px;
    border-radius: 12px;
    padding: 25px 20px 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  label {
    font-weight: 500;
    margin-bottom: 6px;
    color: #000;
  }
  input[type="email"],
  input[type="password"] {
    border: 1.2px solid #ccc;
    border-radius: 14px;
    padding: 10px 14px;
    font-size: 14px;
    color: #666;
    margin-bottom: 20px;
    outline: none;
    transition: border 0.3s ease;
  }
  input[type="email"]::placeholder,
  input[type="password"]::placeholder {
    color: #bbb;
  }
  input[type="email"]:focus,
  input[type="password"]:focus {
    border-color: #888;
  }
  button {
    background: #222;
    color: white;
    border: none;
    padding: 11px 0;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    margin-bottom: 12px;
  }
  button:hover {
    background: #444;
  }
  .forgot-password {
    font-size: 13px;
    color: black;
    text-decoration: underline;
    cursor: pointer;
    user-select: none;
    width: fit-content;
  }
  #errorMsg {
    color: red;
    font-size: 13px;
    margin-bottom: 15px;
    display: none;
  }
</style>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

</head>

<body>

<div class="container">
  <div class="logo-box" aria-label="App logo">

   <img src="STLOGO2.JPG" alt="Logo" style="width:150px;height:100px;">
   
  </div>

  <form id="loginForm" aria-label="Login form">
    <div id="errorMsg"></div>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Value" required autocomplete="username" />

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Value" required autocomplete="current-password" />

    <button type="submit">Sign In</button>
  </form>

  <a href="#" id="forgotPassword" class="forgot-password" role="button" tabindex="0">Forgot password?</a>
</div>

<script>
  // Firebase config - replace with your credentials!
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    // ...other settings
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  const form = document.getElementById('loginForm');
  const errorMsg = document.getElementById('errorMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    errorMsg.textContent = '';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      // Firebase email/password sign in
      const userCredential = await auth.signInWithEmailAndPassword(email, password);
      const user = userCredential.user;

      // Get the Firebase ID token for backend verification
      const idToken = await user.getIdToken();

      // Call your backend to exchange Firebase token for your own JWT token (optional)
      const response = await fetch('http://localhost:3000/api/token', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + idToken
        }
      });

      if (!response.ok) {
        throw new Error('Failed to get JWT token from server');
      }

      const data = await response.json();
      // Store your backend JWT token
      localStorage.setItem('jwtToken', data.token);

      alert('Login successful!');

      // Redirect to your app's main page
      // window.location.href = '/dashboard.html';

    } catch (error) {
      errorMsg.textContent = error.message;
      errorMsg.style.display = 'block';
    }
  });

  document.getElementById('forgotPassword').addEventListener('click', async (e) => {
    e.preventDefault();

    const email = prompt('Enter your email address to reset password:');
    if (!email) return;

    try {
      await auth.sendPasswordResetEmail(email);
      alert('Password reset email sent!');
    } catch (error) {
      alert('Error: ' + error.message);
    }
  });
</script>

</body>
</html>
